name: Daily Regulation Monitor

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/regulation-monitor.yml"
      - "automation/monitor_regulations.py"
      - "automation/regulation-sources.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: regulation-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0

      - name: Check official sources
        id: monitor
        run: python automation/monitor_regulations.py

      - name: Save monitor state
        if: steps.monitor.outputs.should_commit == '1'
        run: |
          git config user.name "autotax-regulation-bot"
          git config user.email "autotax-regulation-bot@users.noreply.github.com"
          git add data/regulation-monitor/state.json data/regulation-monitor/latest-report.json
          git commit -m "Update regulation monitoring state"
          git pull --rebase
          git push

      - name: Create human-review issue
        if: steps.monitor.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_COUNT: ${{ steps.monitor.outputs.changed_count }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/regulation-monitor/latest-report.json").read_text())
          lines = [
              "## 无人值守法规监测发现变化",
              "",
              f"- 检查时间：{report['run_at']}",
              f"- 变化来源：{report['changed_count']}",
              f"- 抓取异常：{report['error_count']}",
              "",
              "> 本提醒不会自动修改税率计算公式。请人工核对原文、生效日期、适用税号及过渡条款。",
              "",
          ]
          for item in report["changes"]:
              lines.extend([
                  f"### {item['title']}",
                  f"- 主题：{item['topic']}",
                  f"- 官方原文：{item['url']}",
                  f"- 字符变化：{item['length_delta']:+d}",
                  f"- PDF页数：{item.get('page_count') or '非PDF'}",
                  f"- OCR复核：{'需要' if item.get('needs_ocr') else '不需要'}",
                  "",
              ])
          Path("regulation-review.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          gh issue create \
            --title "法规变化待审核：${CHANGED_COUNT} 个官方来源" \
            --body-file regulation-review.md

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulation-monitor-report
          path: |
            data/regulation-monitor/latest-report.json
            data/regulation-monitor/state.json
          retention-days: 30
